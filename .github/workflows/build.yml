name: CI Build & Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "*.*.*.*"
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ClassIsland 2.x Plugin
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 8.0 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore ClassIsland.Automation.sln

    - name: Build Core
      run: dotnet build ClassIsland.Automation.Core\ClassIsland.Automation.Core.csproj -c Release --no-restore

    - name: Build ClassIsland 2.x Plugin
      run: dotnet build ClassIsland.Automation.V2\ClassIsland.Automation.V2.csproj -c Release --no-restore

    - name: Package Output
      run: |
        mkdir dist
        Copy-Item -Path "ClassIsland.Automation.V2\bin\Release\net8.0\*" -Destination "dist\" -Recurse -Force
        Copy-Item -Path "README.md" -Destination "dist\README.md" -Force
        Compress-Archive -Path "dist\*" -DestinationPath "ClassIsland.Automation.V2.zip"
        Compress-Archive -Path "dist\*" -DestinationPath "ClassIsland.Automation.V2.cipx"

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ClassIsland-Automation-V2
        path: |
          ClassIsland.Automation.V2.zip
          ClassIsland.Automation.V2.cipx

    - name: Publish GitHub Release (Tag Triggered)
      if: startsWith(github.ref, 'refs/tags/')
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $tagName = $env:GITHUB_REF_NAME
        $v2Md5 = (Get-FileHash ClassIsland.Automation.V2.cipx -Algorithm MD5).Hash

        $releaseNotes = @"
        ClassIsland AI 自动化插件 (2.x) $tagName

        ### 插件包文件
        - **ClassIsland 2.x (Avalonia)**: ``ClassIsland.Automation.V2.cipx``

        ### 校验信息 (ClassIsland 插件索引规范)
        <!-- CLASSISLAND_PKG_MD5 {"ClassIsland.Automation.V2.cipx":"$v2Md5"} -->
        "@

        Set-Content -Path release_notes.md -Value $releaseNotes -Encoding UTF8
        gh release create $tagName ClassIsland.Automation.V2.cipx ClassIsland.Automation.V2.zip --title "$tagName" --notes-file release_notes.md
