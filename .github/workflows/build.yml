name: CI Build & Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "*.*.*.*"
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ClassIsland Plugins (1.x & 2.x)
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 8.0 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore ClassIsland.Automation.sln

    - name: Build Core
      run: dotnet build ClassIsland.Automation.Core\ClassIsland.Automation.Core.csproj -c Release --no-restore

    - name: Build ClassIsland 2.x Plugin
      run: dotnet build ClassIsland.Automation.V2\ClassIsland.Automation.V2.csproj -c Release --no-restore

    - name: Build ClassIsland 1.x Plugin
      run: dotnet build ClassIsland.Automation.V1\ClassIsland.Automation.V1.csproj -c Release --no-restore

    - name: Package 2.x Output
      run: |
        mkdir dist\v2
        Copy-Item -Path "ClassIsland.Automation.V2\bin\Release\net8.0\*" -Destination "dist\v2\" -Recurse -Force
        Compress-Archive -Path "dist\v2\*" -DestinationPath "dist\ClassIsland.Automation.V2.zip"
        Compress-Archive -Path "dist\v2\*" -DestinationPath "dist\ClassIsland.Automation.V2.cipx"

    - name: Package 1.x Output
      run: |
        mkdir dist\v1
        Copy-Item -Path "ClassIsland.Automation.V1\bin\Release\net8.0-windows\*" -Destination "dist\v1\" -Recurse -Force
        Compress-Archive -Path "dist\v1\*" -DestinationPath "dist\ClassIsland.Automation.V1.zip"
        Compress-Archive -Path "dist\v1\*" -DestinationPath "dist\ClassIsland.Automation.V1.cipx"

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ClassIsland-Automation-Plugins
        path: |
          dist\*.zip
          dist\*.cipx

    - name: Publish GitHub Release (Tag Triggered)
      if: startsWith(github.ref, 'refs/tags/')
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $tagName = $env:GITHUB_REF_NAME
        $v1Md5 = (Get-FileHash dist\ClassIsland.Automation.V1.cipx -Algorithm MD5).Hash
        $v2Md5 = (Get-FileHash dist\ClassIsland.Automation.V2.cipx -Algorithm MD5).Hash

        $releaseNotes = @"
        ClassIsland AI 自动化插件 $tagName

        ### 📦 插件包文件
        - **ClassIsland 2.x (Avalonia)**: `ClassIsland.Automation.V2.cipx`
        - **ClassIsland 1.x (WPF)**: `ClassIsland.Automation.V1.cipx`

        ### 🔐 校验信息 (ClassIsland 插件索引规范)
        <!-- CLASSISLAND_PKG_MD5 {"ClassIsland.Automation.V1.cipx":"$v1Md5","ClassIsland.Automation.V2.cipx":"$v2Md5"} -->
        "@

        Set-Content -Path dist\release_notes.md -Value $releaseNotes -Encoding UTF8
        gh release create $tagName dist\ClassIsland.Automation.V1.cipx dist\ClassIsland.Automation.V2.cipx dist\ClassIsland.Automation.V1.zip dist\ClassIsland.Automation.V2.zip --title "$tagName" --notes-file dist\release_notes.md
